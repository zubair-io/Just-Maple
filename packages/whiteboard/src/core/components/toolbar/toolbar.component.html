<div class="toolbar">
    <!-- Tool buttons -->
    <div class="tool-group">
        @for (tool of tools; track tool.type) {
            <button
                class="tool-button"
                [class.active]="activeTool() === tool.type"
                [attr.title]="tool.label + ' (' + tool.shortcut + ')'"
                (click)="selectTool(tool.type)"
            >
                @switch (tool.icon) {
                    @case ('cursor') {
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z" />
                            <path d="M13 13l6 6" />
                        </svg>
                    }
                    @case ('pen') {
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 19l7-7 3 3-7 7-3-3z" />
                            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" />
                            <path d="M2 2l7.586 7.586" />
                            <circle cx="11" cy="11" r="2" />
                        </svg>
                    }
                    @case ('line') {
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="5" y1="19" x2="19" y2="5" />
                        </svg>
                    }
                    @case ('rectangle') {
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" />
                        </svg>
                    }
                    @case ('ellipse') {
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <ellipse cx="12" cy="12" rx="10" ry="8" />
                        </svg>
                    }
                    @case ('arrow') {
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="5" y1="19" x2="19" y2="5" />
                            <polyline points="10,5 19,5 19,14" />
                        </svg>
                    }
                }
            </button>
        }
    </div>

    <div class="divider"></div>

    <!-- Color picker -->
    <div class="color-picker-wrapper">
        <button
            class="color-button"
            [style.background-color]="strokeColor()"
            title="Stroke color"
            (click)="toggleColorPicker()"
        ></button>

        @if (showColorPicker()) {
            <div class="color-picker-popup">
                @for (color of colors; track color) {
                    <button
                        class="color-option"
                        [style.background-color]="color"
                        [class.active]="strokeColor() === color"
                        (click)="selectColor(color)"
                    ></button>
                }
            </div>
        }
    </div>

    <!-- Size picker -->
    <div class="size-picker-wrapper">
        <button class="size-button" title="Stroke size" (click)="toggleSizePicker()">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <circle cx="12" cy="12" [attr.r]="2 + strokeSize() / 2" />
            </svg>
        </button>

        @if (showSizePicker()) {
            <div class="size-picker-popup">
                @for (size of sizes; track size) {
                    <button
                        class="size-option"
                        [class.active]="strokeSize() === size"
                        (click)="selectSize(size)"
                    >
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <circle cx="12" cy="12" [attr.r]="2 + size / 2" />
                        </svg>
                    </button>
                }
            </div>
        }
    </div>

    <div class="divider"></div>

    <!-- Zoom controls -->
    <div class="zoom-controls">
        <button class="zoom-button" title="Zoom out" (click)="onZoomOut()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
        </button>
        <button class="zoom-level" title="Reset zoom" (click)="onZoomReset()">
            {{ zoomPercent() }}%
        </button>
        <button class="zoom-button" title="Zoom in" (click)="onZoomIn()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
        </button>
    </div>
</div>
