properties:
  environmentId: ${MANAGED_ENV_ID}
  configuration:
    ingress:
      external: true
      targetPort: 7071
    registries:
      - server: ${REGISTRY_SERVER}
        username: ${REGISTRY_USER}
        passwordSecretRef: registry-password
    secrets:
      - name: registry-password
        value: ${REGISTRY_PASS}
      - name: jwt-secret
        value: ${JWT_SECRET}
  template:
    containers:
      - name: api
        image: ${IMAGE_TAG}
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          - name: MONGODB_URI
            value: mongodb://localhost:27017/justmaple
          - name: REDIS_URL
            value: redis://localhost:6379
          - name: JWT_SECRET
            secretRef: jwt-secret
      - name: mongodb
        image: docker.io/library/mongo:7
        resources:
          cpu: 0.25
          memory: 0.5Gi
      - name: redis
        image: docker.io/library/redis:7-alpine
        resources:
          cpu: 0.25
          memory: 0.5Gi
    scale:
      minReplicas: 1
      maxReplicas: 1
