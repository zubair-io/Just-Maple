name: Trigger auto deployment for paperbark-maple

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/paperbark-maple-AutoDeployTrigger-4f9133f7-d727-492a-9f84-5ad3bf2f2c3d.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.PAPERBARKMAPLE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PAPERBARKMAPLE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PAPERBARKMAPLE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/apps/api
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: acrjustmaple.azurecr.io
          registryUsername: ${{ secrets.PAPERBARKMAPLE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.PAPERBARKMAPLE_REGISTRY_PASSWORD }}
          containerAppName: paperbark-maple
          resourceGroup: rg-paperbark-maple
          imageToBuild: acrjustmaple.azurecr.io/paperbark-maple:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


