name: Trigger auto deployment for ca-justmaple-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/ca-justmaple-api-AutoDeployTrigger-c508967e-3074-42b5-9003-2e59f7fef6fd.yml'

  # Allow manual trigger 
  workflow_dispatch:
      
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.CAJUSTMAPLEAPI_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/apps/api
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: acrjustmaple.azurecr.io
          registryUsername: ${{ secrets.CAJUSTMAPLEAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CAJUSTMAPLEAPI_REGISTRY_PASSWORD }}
          containerAppName: ca-justmaple-api
          resourceGroup: rg-justmaple-prod
          imageToBuild: acrjustmaple.azurecr.io/ca-justmaple-api:${{ github.sha }}
          
            

     

