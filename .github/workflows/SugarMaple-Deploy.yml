name: Build Helix and Upload to Azure Blob Storage

on:
    push:
        branches:
            - development

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install

            - name: Build
              run: bun run build:helix

            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist

            - name: List build output
              run: ls dist/web/browser

            - name: Azure Login
              uses: azure/login@v2
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Upload to blob storage
              uses: azure/CLI@v2
              with:
                  inlineScript: |
                      az storage blob upload-batch --overwrite true --account-name hornbeam --auth-mode key -d 'justmaple' -s dist/web/browser

            - name: Azure Logout
              run: az logout
              if: always()
