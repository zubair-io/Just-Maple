name: Deploy JapaneseMaple to Phoebe and Just Maple to Hornbeam

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy-main
    cancel-in-progress: false

jobs:
    checks:
        if: github.repository == 'zubair-io/Just-Maple' && github.ref == 'refs/heads/main'
        uses: ./.github/workflows/ci.yml

    build:
        needs: checks
        runs-on: ubuntu-22.04
        timeout-minutes: 40
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.3
            - run: bun install --frozen-lockfile
            - run: bun run build:api
            - run: bun run build:web:paperbark
            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.98.1
            - run: cargo build --release --locked --manifest-path apps/search-worker/Cargo.toml
            - name: Package Phoebe runtime
              run: python3 infra/phoebe/release_bundle.py
            - uses: actions/upload-artifact@v4
              with:
                  name: main-deployment
                  path: |
                      deploy/phoebe-runtime.tgz
                      deploy/phoebe-runtime.tgz.sha256
                  if-no-files-found: error
                  retention-days: 14

    publish-phoebe:
        name: Publish Phoebe runtime
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: main-deployment
                  path: deploy
            - name: Publish immutable main runtime for Phoebe to pull
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  SOURCE_SHA: ${{ github.sha }}
              run: |
                  set -euo pipefail
                  tag="phoebe-main-${SOURCE_SHA}"
                  # A rerun never replaces a published runtime.
                  if ! gh release view "$tag" >/dev/null 2>&1; then
                    gh release create "$tag" \
                      deploy/phoebe-runtime.tgz deploy/phoebe-runtime.tgz.sha256 \
                      --target "$SOURCE_SHA" --prerelease --latest=false \
                      --title "Phoebe main ${SOURCE_SHA:0:12}" \
                      --notes "Tested main runtime. Phoebe activates after this workflow succeeds."
                  fi

    verify-phoebe:
        needs: publish-phoebe
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Wait for Phoebe to activate the exact commit
              env:
                  PHOEBE_PUBLIC_URL: ${{ vars.PHOEBE_PUBLIC_URL }}
                  SOURCE_SHA: ${{ github.sha }}
              run: |
                  python3 - <<'PY'
                  import json, os, time, urllib.request
                  origin = os.environ['PHOEBE_PUBLIC_URL'].rstrip('/')
                  if not origin.startswith('https://'):
                      raise SystemExit('Configure PHOEBE_PUBLIC_URL as the HTTPS app origin')
                  sha = os.environ['SOURCE_SHA']
                  for attempt in range(60):
                      try:
                          request = urllib.request.Request(origin + '/deployment.json?commit=' + sha,
                                                           headers={'Cache-Control': 'no-cache',
                                                                    'User-Agent': 'JapaneseMaple-CI/1.0'})
                          with urllib.request.urlopen(request, timeout=10) as response:
                              deployed = json.load(response)
                          request = urllib.request.Request(origin + '/api/health',
                                                           headers={'User-Agent': 'JapaneseMaple-CI/1.0'})
                          with urllib.request.urlopen(request, timeout=10) as response:
                              health = json.load(response)
                          if (deployed.get('sourceCommit') == sha and health.get('status') == 'healthy'
                                  and health.get('search') == 'ready'):
                              print('Phoebe activated ' + sha)
                              break
                      except (OSError, ValueError):
                          pass
                      time.sleep(15)
                  else:
                      raise SystemExit('Phoebe did not activate this commit; inspect its deployment service')
                  PY

    build-just-maple:
        needs: checks
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.3
            - run: bun install --cwd apps/local/web --frozen-lockfile
            - name: Build the separate serverless Just Maple frontend
              run: bun run --cwd apps/local/web build:production
            - name: Stage Just Maple and retire the previous app's service worker
              run: |
                  python3 - <<'PY'
                  from pathlib import Path
                  import shutil
                  source = Path('apps/local/web/dist/web/browser')
                  assert '<title>Just Maple</title>' in (source / 'index.html').read_text()
                  output = Path('deploy/just-maple')
                  shutil.copytree(source, output)
                  # Clear only Angular's old ngsw caches, never user IndexedDB/files.
                  worker = Path('apps/local/web/node_modules/@angular/service-worker')
                  shutil.copy2(worker / 'safety-worker.js', output / 'ngsw-worker.js')
                  (output / 'licenses').mkdir(exist_ok=True)
                  shutil.copy2(worker / 'LICENSE', output / 'licenses/Angular-service-worker.txt')
                  PY
            - uses: actions/upload-artifact@v4
              with:
                  name: just-maple-web
                  path: deploy/just-maple/
                  if-no-files-found: error
                  retention-days: 14

    deploy-hornbeam:
        needs: build-just-maple
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: just-maple-web
                  path: deploy/just-maple
            - uses: azure/login@v2
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}
            - name: Publish Just Maple to hornbeam / just-maple
              shell: bash
              run: |
                  set -euo pipefail
                  # Assets first; retain prior hashed assets for already-open clients.
                  cp deploy/just-maple/index.html deploy/index.html
                  cp deploy/just-maple/ngsw-worker.js deploy/ngsw-worker.js
                  rm deploy/just-maple/index.html deploy/just-maple/ngsw-worker.js
                  az storage blob upload-batch --overwrite true --auth-mode login \
                    --account-name hornbeam --destination just-maple --source deploy/just-maple
                  az storage blob upload --overwrite true --auth-mode login \
                    --account-name hornbeam --container-name just-maple \
                    --name index.html --file deploy/index.html \
                    --content-type text/html --content-cache-control no-cache
                  az storage blob upload --overwrite true --auth-mode login \
                    --account-name hornbeam --container-name just-maple \
                    --name ngsw-worker.js --file deploy/ngsw-worker.js \
                    --content-type application/javascript --content-cache-control no-cache
            - name: Azure Logout
              if: always()
              run: az logout
