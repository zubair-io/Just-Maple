name: Deploy Web to Azure Blob Storage

on:
    push:
        branches:
            - main
        paths:
            - 'apps/web/**'
            - 'packages/shared/**'
            - '.github/workflows/SugarMaple-Deploy.yml'
    workflow_dispatch:

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install

            - name: Build shared package
              run: bun run build:shared

            - name: Build web
              run: bun run build:web

            - name: Azure Login
              uses: azure/login@v2
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Upload to blob storage
              uses: azure/CLI@v2
              with:
                  inlineScript: |
                      az storage blob upload-batch \
                        --overwrite true \
                        --account-name hornbeam \
                        --auth-mode login \
                        -d 'just-maple' \
                        -s apps/web/dist/web/browser

            - name: Azure Logout
              run: az logout
              if: always()
