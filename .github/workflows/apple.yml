name: Apple
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    name: apple-${{ matrix.platform }}
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            destination: generic/platform=macOS
          - platform: ios
            destination: generic/platform=iOS
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build Apple app and embedded Watch app without distribution signing
        env:
          DESTINATION: ${{ matrix.destination }}
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project apps/apple/JapaneseMaple.xcodeproj \
            -scheme JapaneseMaple -configuration Release \
            -destination "$DESTINATION" -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build
      # The Home Assistant unit tests (connector, rules, action queue, settings, local
      # store). Ad hoc signed without entitlements, so the test host launches without a
      # team's provisioning profile.
      - name: Run macOS unit tests
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          xcodebuild -project apps/apple/JapaneseMaple.xcodeproj \
            -scheme JapaneseMaple -configuration Debug \
            -destination "platform=macOS" -derivedDataPath "$RUNNER_TEMP/DerivedDataTests" \
            -skipPackagePluginValidation -skipMacroValidation \
            -only-testing:JapaneseMapleTests/HomeExposureTests \
            -only-testing:JapaneseMapleTests/HomeAssistantConnectionTests \
            -only-testing:JapaneseMapleTests/HomeChangeCoalescerTests \
            -only-testing:JapaneseMapleTests/HomeAssistantActionTests \
            -only-testing:JapaneseMapleTests/HomeActionQueueTests \
            -only-testing:JapaneseMapleTests/HomeAssistantSettingsTests \
            -only-testing:JapaneseMapleTests/HomeEngineTests \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= CODE_SIGN_ENTITLEMENTS= \
            test
