name: Trigger auto deployment for ca-justmaple-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/ca-justmaple-api-AutoDeployTrigger-855988b8-dfc3-4ac9-8656-3e413b61a010.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CAJUSTMAPLEAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CAJUSTMAPLEAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CAJUSTMAPLEAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: acrjustmaple.azurecr.io
          registryUsername: ${{ secrets.CAJUSTMAPLEAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CAJUSTMAPLEAPI_REGISTRY_PASSWORD }}
          containerAppName: ca-justmaple-api
          resourceGroup: rg-justmaple-prod
          imageToBuild: acrjustmaple.azurecr.io/ca-justmaple-api:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


