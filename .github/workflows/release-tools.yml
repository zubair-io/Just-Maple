name: Release tooling
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    name: Release tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tools -p 'test_release_*.py'
      - run: python3 -m unittest discover -s apps/apple/ci_scripts -p 'test_*.py'
      - run: shellcheck apps/apple/ci_scripts/*.sh
