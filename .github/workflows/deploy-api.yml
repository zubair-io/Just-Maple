name: Deploy API to Azure Container Apps

on:
    push:
        branches:
            - main
        paths:
            - 'apps/api/**'
            - 'apps/web/**'
            - 'packages/shared/**'
            - '.github/workflows/deploy-api.yml'
    workflow_dispatch:

env:
    REGISTRY: acrjustmaple.azurecr.io
    IMAGE_NAME: justmaple-api
    RESOURCE_GROUP: rg-justmaple-prod
    CONTAINER_APP: ca-justmaple-api

jobs:
    # Only deploy if CI passed
    build-and-deploy:
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Azure Login (OIDC)
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.CAJUSTMAPLEAPI_AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.CAJUSTMAPLEAPI_AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.CAJUSTMAPLEAPI_AZURE_SUBSCRIPTION_ID }}

            - name: Log in to Azure Container Registry
              uses: azure/docker-login@v1
              with:
                  login-server: ${{ env.REGISTRY }}
                  username: ${{ secrets.CAJUSTMAPLEAPI_REGISTRY_USERNAME }}
                  password: ${{ secrets.CAJUSTMAPLEAPI_REGISTRY_PASSWORD }}

            - name: Build and push Docker image
              run: |
                  docker build \
                    -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                    -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
                    -f apps/api/Dockerfile .
                  docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
                  docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            - name: Deploy to Container Apps
              uses: azure/container-apps-deploy-action@v2
              with:
                  resourceGroup: ${{ env.RESOURCE_GROUP }}
                  containerAppName: ${{ env.CONTAINER_APP }}
                  imageToDeploy: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
