name: Deploy API to Azure Container Apps

# Phoebe is authoritative. Azure deployment is retained only for deliberate recovery.
on:
    workflow_dispatch:
        inputs:
            confirm_legacy_recovery:
                description: 'Phoebe writes have been reconciled and restoring Azure is intended'
                required: true
                type: boolean
                default: false

env:
    REGISTRY: acrjustmaple.azurecr.io
    IMAGE_NAME: justmaple-api
    RESOURCE_GROUP: rg-justmaple-prod
    CONTAINER_APP: ca-justmaple-api

jobs:
    # Re-enable this workflow only after a reviewed recovery/reconciliation decision.
    build-and-deploy:
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_legacy_recovery }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Azure Login (OIDC)
              uses: azure/login@v2
              with:
                creds: ${{ secrets.CAJUSTMAPLEAPI_AZURE_CREDENTIALS }}

            - name: Log in to Azure Container Registry
              uses: azure/docker-login@v1
              with:
                  login-server: ${{ env.REGISTRY }}
                  username: ${{ secrets.CAJUSTMAPLEAPI_REGISTRY_USERNAME }}
                  password: ${{ secrets.CAJUSTMAPLEAPI_REGISTRY_PASSWORD }}

            - name: Build and push Docker image
              run: |
                  docker build \
                    -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                    -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
                    -f apps/api/Dockerfile .
                  docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
                  docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            - name: Deploy to Container Apps
              uses: azure/container-apps-deploy-action@v2
              with:
                  resourceGroup: ${{ env.RESOURCE_GROUP }}
                  containerAppName: ${{ env.CONTAINER_APP }}
                  imageToDeploy: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
