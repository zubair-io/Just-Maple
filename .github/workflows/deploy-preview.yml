name: Deploy Preview Environment

on:
    pull_request:
        types: [opened, synchronize, reopened]
        paths:
            - 'apps/api/**'
            - 'apps/web/**'
            - 'packages/shared/**'

    # Cleanup when PR is closed/merged
    pull_request_target:
        types: [closed]

env:
    REGISTRY: acrjustmaple.azurecr.io
    IMAGE_NAME: justmaple-api
    RESOURCE_GROUP: rg-justmaple-preview
    CONTAINER_APP_ENV: cae-justmaple-preview

jobs:
    deploy-preview:
        if: github.event.action != 'closed'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            id-token: write
            contents: read
            pull-requests: write

        outputs:
            preview_url: ${{ steps.deploy.outputs.preview_url }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Generate preview name
              id: preview-name
              run: |
                  # Use PR number for short, unique name (e.g., ca-preview-pr-50)
                  PR_NUMBER="${{ github.event.pull_request.number }}"
                  echo "name=ca-preview-pr-${PR_NUMBER}" >> $GITHUB_OUTPUT
                  echo "label=pr-${PR_NUMBER}" >> $GITHUB_OUTPUT

            - name: Azure Login (OIDC)
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.CAJUSTMAPLEAPI_AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.CAJUSTMAPLEAPI_AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.CAJUSTMAPLEAPI_AZURE_SUBSCRIPTION_ID }}

            - name: Log in to Azure Container Registry
              uses: azure/docker-login@v1
              with:
                  login-server: ${{ env.REGISTRY }}
                  username: ${{ secrets.CAJUSTMAPLEAPI_REGISTRY_USERNAME }}
                  password: ${{ secrets.CAJUSTMAPLEAPI_REGISTRY_PASSWORD }}

            - name: Build and push Docker image
              run: |
                  docker build \
                    -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }} \
                    -f apps/api/Dockerfile .
                  docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}

            - name: Deploy Container App with Bicep
              id: deploy
              run: |
                  CONTAINER_APP="${{ steps.preview-name.outputs.name }}"
                  IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}"
                  ENV_ID="/subscriptions/${{ secrets.CAJUSTMAPLEAPI_AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ env.RESOURCE_GROUP }}/providers/Microsoft.App/managedEnvironments/${{ env.CONTAINER_APP_ENV }}"
                  # Use short commit SHA as revision suffix to force new deployment
                  REVISION_SUFFIX="${{ github.event.pull_request.head.sha }}"
                  REVISION_SUFFIX="${REVISION_SUFFIX:0:8}"

                  echo "Deploying container app: $CONTAINER_APP with revision: $REVISION_SUFFIX"
                  RESULT=$(az deployment group create \
                    --resource-group ${{ env.RESOURCE_GROUP }} \
                    --template-file .github/templates/containerapp.bicep \
                    --parameters \
                      containerAppName="$CONTAINER_APP" \
                      environmentId="$ENV_ID" \
                      imageTag="$IMAGE_TAG" \
                      registryServer="${{ env.REGISTRY }}" \
                      registryUsername="${{ secrets.CAJUSTMAPLEAPI_REGISTRY_USERNAME }}" \
                      registryPassword="${{ secrets.CAJUSTMAPLEAPI_REGISTRY_PASSWORD }}" \
                      jwtSecret="${{ secrets.JWT_SECRET }}" \
                      revisionSuffix="$REVISION_SUFFIX" \
                    --query "properties.outputs.fqdn.value" -o tsv)

                  echo "preview_url=https://${RESULT}" >> $GITHUB_OUTPUT

            - name: Comment on PR with preview URL
              uses: actions/github-script@v7
              with:
                  script: |
                      const previewUrl = '${{ steps.deploy.outputs.preview_url }}';
                      const body = `## 🍁 Preview Environment Ready

                      | Environment | URL |
                      |-------------|-----|
                      | API | ${previewUrl} |
                      | Health Check | ${previewUrl}/api/health |

                      **Note:** This is a self-contained environment with its own MongoDB and Redis.
                      Data is ephemeral and will be lost when the container restarts.

                      This preview will be automatically deleted when the PR is closed.`;

                      // Find existing comment
                      const comments = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                      });

                      const botComment = comments.data.find(c =>
                        c.user.type === 'Bot' && c.body.includes('Preview Environment Ready')
                      );

                      if (botComment) {
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: botComment.id,
                          body: body
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body: body
                        });
                      }

    cleanup-preview:
        if: github.event.action == 'closed'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            id-token: write
            contents: read

        steps:
            - name: Generate preview name
              id: preview-name
              run: |
                  PR_NUMBER="${{ github.event.pull_request.number }}"
                  echo "name=ca-preview-pr-${PR_NUMBER}" >> $GITHUB_OUTPUT

            - name: Azure Login (OIDC)
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.CAJUSTMAPLEAPI_AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.CAJUSTMAPLEAPI_AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.CAJUSTMAPLEAPI_AZURE_SUBSCRIPTION_ID }}

            - name: Delete preview Container App
              run: |
                  CONTAINER_APP="${{ steps.preview-name.outputs.name }}"

                  echo "Deleting preview environment: $CONTAINER_APP"
                  az containerapp delete \
                    --name "$CONTAINER_APP" \
                    --resource-group ${{ env.RESOURCE_GROUP }} \
                    --yes || echo "Container app not found or already deleted"

            - name: Delete container image
              run: |
                  az acr repository delete \
                    --name acrjustmaple \
                    --image ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }} \
                    --yes || echo "Image not found or already deleted"
