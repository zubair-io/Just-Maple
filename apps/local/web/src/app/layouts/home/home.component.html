<div class="h-screen pt-[env(safe-area-inset-top)] flex overflow-hidden bg-[var(--color-bg)]">
  <!-- Mobile Overlay -->
  @if (sidebarOpen()) {
    <div class="fixed inset-0 bg-black/50 z-40 md:hidden" (click)="closeSidebar()"></div>
  }

  <!-- Sidebar -->
  <div
    class="fixed inset-y-0 left-0 z-50 transform transition-transform duration-300 ease-in-out md:relative md:translate-x-0 md:h-full"
    [class.-translate-x-full]="!sidebarOpen()"
    [class.translate-x-0]="sidebarOpen()"
  >
    <app-sidebar
      [selectedFolderId]="selectedFolderId()"
      (newPage)="onNewPage()"
      (selectPage)="onSelectPage($event); closeSidebar()"
      (selectFolder)="onSelectFolder($event)"
      (settings)="onSettings()"
    />
  </div>

  <!-- Main Content Area -->
  <main
    class="flex-1 flex flex-col overflow-hidden relative bg-[var(--color-bg)]"
    (touchstart)="onTouchStart($event)"
    (touchmove)="onTouchMove($event)"
    (touchend)="onTouchEnd($event)"
  >
    <!-- Mobile Header -->
    <div class="flex items-center gap-3 px-4 py-3 border-b border-[var(--color-border)] md:hidden">
      <button
        (click)="toggleSidebar()"
        class="flex items-center justify-center w-9 h-9 rounded-lg hover:bg-[var(--color-surface-hover)] text-[var(--color-text-muted)]"
      >
        <span class="material-symbols-rounded text-xl">menu</span>
      </button>
      <span class="font-serif font-bold text-sm text-[var(--color-text-main)]"
        >Just Maple Local</span
      >
    </div>

    <router-outlet />
  </main>
</div>
