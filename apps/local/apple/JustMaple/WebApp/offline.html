<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Just Maple - Editor unavailable</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                padding: 20px;
                color: #2c3e50;
            }

            .container {
                text-align: center;
                max-width: 400px;
            }

            .icon {
                width: 80px;
                height: 80px;
                margin: 0 auto 24px;
                background: #d94e3b;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 4px 12px rgba(217, 78, 59, 0.2);
            }

            .icon svg {
                width: 40px;
                height: 40px;
                fill: white;
            }

            h1 {
                font-size: 24px;
                font-weight: 600;
                margin-bottom: 12px;
                color: #2c3e50;
            }

            p {
                font-size: 16px;
                line-height: 1.6;
                color: #64748b;
                margin-bottom: 24px;
            }

            .status {
                background: white;
                padding: 16px 20px;
                border-radius: 12px;
                border: 1px solid #e2e8f0;
                margin-top: 24px;
                font-size: 14px;
                color: #64748b;
            }

            .status strong {
                color: #2c3e50;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path
                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"
                    />
                </svg>
            </div>

            <h1>Editor unavailable</h1>
            <p>Just Maple could not load its bundled editor. Restart the app and try again.</p>

            <div class="status">
                <strong>Next Steps:</strong><br />
                Your notes remain in your local or iCloud folder.<br />
                If restarting does not help, rebuild or reinstall the app.
            </div>
        </div>
    </body>
</html>
