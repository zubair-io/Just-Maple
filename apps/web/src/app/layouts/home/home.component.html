<div
  class="h-screen pt-[env(safe-area-inset-top)] pb-[env(safe-area-inset-bottom)] flex overflow-hidden bg-[var(--color-bg)]"
>
  <!-- Mobile Overlay -->
  @if (sidebarOpen()) {
    <div class="fixed inset-0 bg-black/50 z-40 md:hidden" (click)="closeSidebar()"></div>
  }

  <!-- Sidebar -->
  <div
    class="fixed inset-y-0 left-0 z-50 transform transition-transform duration-300 ease-in-out md:relative md:translate-x-0 md:h-full"
    [class.-translate-x-full]="!sidebarOpen()"
    [class.translate-x-0]="sidebarOpen()"
  >
    <app-sidebar
      [selectedNotebookId]="selectedNotebookId()"
      (newPage)="onNewPage($event)"
      (newFromTemplate)="onNewFromTemplate()"
      (selectPage)="onSelectPage($event); closeSidebar()"
      (selectNotebook)="onSelectNotebook($event)"
      (createNotebook)="onCreateNotebook()"
      (settings)="onSettings()"
      (search)="uiStateService.openSearchModal()"
    />
  </div>

  <!-- Main Content Area -->
  <main
    class="flex-1 flex flex-col overflow-hidden relative bg-[var(--color-bg)]"
    (touchstart)="onTouchStart($event)"
    (touchmove)="onTouchMove($event)"
    (touchend)="onTouchEnd($event)"
  >
    <router-outlet />
  </main>
</div>

<!-- Template Gallery Modal -->
@if (showTemplateGallery()) {
  <app-template-gallery-modal
    [notebookId]="selectedNotebookId() || notebookService.notebooks()[0]?._id || ''"
    [notebookName]="getSelectedNotebookName()"
    (closed)="onTemplateGalleryClosed()"
    (created)="onTemplateCreated($event)"
  />
}

<!-- Search Modal (Cmd+K / Ctrl+K) -->
@if (showSearchModal()) {
  <app-search-modal (closed)="onSearchClosed()" />
}
