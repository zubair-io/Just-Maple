<div class="h-dvh flex overflow-hidden bg-[var(--color-bg)]">
  <!-- Mobile Overlay -->
  @if (sidebarOpen()) {
    <div class="fixed inset-0 bg-black/50 z-40 md:hidden" (click)="closeSidebar()"></div>
  }

  <!-- Sidebar -->
  <div
    class="fixed inset-y-0 left-0 z-50 transform transition-transform duration-300 ease-in-out md:relative md:translate-x-0 md:h-full"
    [class.-translate-x-full]="!sidebarOpen()"
    [class.translate-x-0]="sidebarOpen()"
  >
    <app-sidebar
      [selectedNotebookId]="selectedNotebookId()"
      (newPage)="onNewPage()"
      (selectPage)="onSelectPage($event); closeSidebar()"
      (selectNotebook)="onSelectNotebook($event)"
      (createNotebook)="onCreateNotebook()"
      (settings)="onSettings()"
    />
  </div>

  <!-- Main Content Area -->
  <main
    class="flex-1 flex flex-col overflow-hidden relative bg-[var(--color-bg)]"
    [style.padding-bottom]="
      shouldShowFooterPadding() ? 'max(env(safe-area-inset-bottom), 4rem)' : '0'
    "
    (touchstart)="onTouchStart($event)"
    (touchmove)="onTouchMove($event)"
    (touchend)="onTouchEnd($event)"
  >
    <router-outlet />
  </main>

  <!-- Mobile Footer Nav (hidden when chat input is focused) -->
  @if (!chatInputFocused()) {
    <nav
      class="fixed bottom-0 left-0 right-0 h-16 bg-[var(--color-surface)] border-t border-[var(--color-border)] flex items-center justify-around px-4 z-30 md:hidden"
    >
      <!-- Menu Button -->
      <button
        (click)="toggleSidebar()"
        class="flex flex-col items-center justify-center gap-1 p-2 rounded-lg text-[var(--color-text-muted)] hover:text-[var(--color-primary)] hover:bg-[var(--color-primary-light)] transition-colors"
      >
        <span class="material-symbols-rounded text-2xl">menu</span>
        <span class="text-[10px] font-medium">Menu</span>
      </button>

      <!-- New Page button -->
      <button
        (click)="createNewPage()"
        class="flex flex-col items-center justify-center gap-1 p-2 rounded-lg text-[var(--color-text-muted)] hover:text-[var(--color-primary)] hover:bg-[var(--color-primary-light)] transition-colors"
      >
        <span class="material-symbols-rounded text-2xl">edit</span>
        <span class="text-[10px] font-medium">New Page</span>
      </button>

      <!-- Settings Button -->
      <button
        (click)="onSettings()"
        class="flex flex-col items-center justify-center gap-1 p-2 rounded-lg text-[var(--color-text-muted)] hover:text-[var(--color-primary)] hover:bg-[var(--color-primary-light)] transition-colors"
      >
        <span class="material-symbols-rounded text-2xl">settings</span>
        <span class="text-[10px] font-medium">Settings</span>
      </button>
    </nav>
  }
</div>
