<div class="whiteboard-page">
  @if (selectedPage(); as page) {
    <app-note-header
      [page]="page"
      [notebook]="selectedNotebook()"
      (toggleFavorite)="toggleFavorite()"
      (deleteRequested)="handleDelete()"
      (publishToggled)="handlePublishToggle($event)"
    />

    <div class="whiteboard-content">
      @if (pageId(); as id) {
        <app-whiteboard [pageId]="id" />
      }
    </div>
  } @else {
    <div class="loading-state">
      <div class="loading-spinner"></div>
      <span>Loading whiteboard...</span>
    </div>
  }
</div>
