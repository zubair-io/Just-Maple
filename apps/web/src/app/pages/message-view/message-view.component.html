@if (selectedNotebook(); as notebook) {
  <div class="message-view">
    <app-notebook-header
      [notebook]="notebook"
      [members]="members()"
      [contextIcon]="'chat'"
      [contextLabel]="selectedPage()?.title || 'Messages'"
      [showNewButton]="true"
      (shareClicked)="openShareModal()"
    />

    <div class="chat-container">
      <app-chat [notebookId]="selectedNotebookId()!" (openThread)="openThread($event)" />

      @if (activeThreadMessage()) {
        <app-thread-panel
          [parentMessage]="activeThreadMessage()!"
          [notebookId]="selectedNotebookId()!"
          (closed)="closeThread()"
        />
      }
    </div>
  </div>
} @else {
  <div class="loading-state">
    <span class="material-symbols-rounded spin">progress_activity</span>
    <span>Loading messages...</span>
  </div>
}

<!-- Share Modal -->
@if (showShareModal() && selectedNotebook()) {
  <app-share-modal
    [notebook]="selectedNotebook()!"
    [members]="members()"
    (closed)="closeShareModal()"
    (membersChanged)="onMembersChanged()"
  />
}
