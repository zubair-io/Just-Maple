<div class="notebook-page">
  @if (selectedPage(); as page) {
    <app-note-header
      [page]="page"
      [notebook]="selectedNotebook()"
      [canUndo]="canUndo()"
      [canRedo]="canRedo()"
      [isFullWidth]="isFullWidth()"
      [pageId]="pageId() ?? ''"
      [contentDirty]="contentDirty()"
      (toggleFavorite)="toggleFavorite()"
      (exportRequested)="handleExport($event)"
      (undoRequested)="handleUndo()"
      (redoRequested)="handleRedo()"
      (toggleWidthRequested)="handleToggleWidth()"
      (versionRestored)="handleVersionRestored()"
      (deleteRequested)="handleDelete()"
      (publishToggled)="handlePublishToggle($event)"
    />

    <div class="notebook-content">
      @if (pageId(); as id) {
        @if (notebookId(); as nbId) {
          <app-notebook-editor [pageId]="id" [notebookId]="nbId" />
        }
      }
    </div>
  } @else {
    <div class="loading-state">
      <div class="loading-spinner"></div>
      <span>Loading notebook...</span>
    </div>
  }
</div>
