<!-- Header -->
<app-notebook-header
  [notebook]="selectedNotebook()!"
  [members]="members()"
  contextIcon="chat"
  contextLabel="Messages"
  (shareClicked)="openShareModal()"
/>

<!-- Chat Content -->
@if (selectedNotebook()) {
  <app-chat [tagId]="selectedNotebook()!._id" />
} @else {
  <div class="empty-state">
    <div class="empty-icon">
      <span class="material-symbols-rounded">forum</span>
    </div>
    <h2>Select a folder</h2>
    <p>Choose a folder from the sidebar to view messages</p>
  </div>
}

<!-- Share Modal -->
@if (showShareModal() && selectedNotebook()) {
  <app-share-modal
    [notebook]="selectedNotebook()!"
    [members]="members()"
    (closed)="closeShareModal()"
    (membersChanged)="onMembersChanged()"
  />
}
