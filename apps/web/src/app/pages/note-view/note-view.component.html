<!-- Header -->
<app-note-header
  [note]="selectedNote()"
  [tag]="selectedTag()"
  (toggleFavorite)="toggleFavorite()"
/>

<!-- Note Editor -->
@if (selectedNote()) {
  <app-note-editor />
} @else {
  <div class="empty-state">
    <div class="empty-icon">
      <span class="material-symbols-rounded">edit_note</span>
    </div>
    <h2>Note not found</h2>
    <p>The requested note could not be loaded</p>
  </div>
}
