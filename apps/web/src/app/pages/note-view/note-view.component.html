<!-- Header -->
@if (selectedNote()) {
  <header
    class="h-14 flex items-center justify-between px-6 py-4 flex-shrink-0 bg-[var(--color-bg)]/95 backdrop-blur-sm sticky top-0 z-10 border-b border-[var(--color-border)]"
  >
    <!-- Breadcrumb -->
    <div class="flex items-center gap-2 text-xs text-[var(--color-text-muted)]">
      @if (selectedTag()) {
        <div
          class="flex items-center gap-1.5 hover:text-[var(--color-text-main)] cursor-pointer transition-colors p-1 rounded hover:bg-stone-100"
        >
          <span class="material-icons-round text-sm text-[var(--color-primary)]">tag</span>
          <span>{{ selectedTag()!.label }}</span>
        </div>
        <span class="text-stone-300">/</span>
      }
      <div
        class="flex items-center gap-1.5 text-[var(--color-text-main)] font-medium p-1 rounded bg-stone-100"
      >
        <span class="material-icons-round text-sm">article</span>
        <span>{{ selectedNote()!.title }}</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-1">
      <span class="text-xs text-[var(--color-text-muted)] mr-2">
        Edited {{ formatDate(selectedNote()!.updatedAt) }}
      </span>
      <div class="flex items-center border-l border-[var(--color-border)] pl-2 gap-1">
        <button
          class="w-8 h-8 flex items-center justify-center rounded-full text-[var(--color-text-muted)] hover:text-[var(--color-text-main)] hover:bg-stone-100 transition-colors"
          title="Note Info"
        >
          <span class="material-icons-round text-lg">info_outline</span>
        </button>
        <button
          (click)="toggleFavorite()"
          class="w-8 h-8 flex items-center justify-center rounded-full transition-colors"
          [class.text-[var(--color-primary)]]="selectedNote()?.isFavorite"
          [class.text-[var(--color-text-muted)]]="!selectedNote()?.isFavorite"
          [class.hover:text-[var(--color-text-main)]]="!selectedNote()?.isFavorite"
          [class.hover:bg-stone-100]="true"
          title="Favorite"
        >
          <span class="material-icons-round text-lg">
            {{ selectedNote()?.isFavorite ? 'star' : 'star_border' }}
          </span>
        </button>
        <button
          class="w-8 h-8 flex items-center justify-center rounded-full text-[var(--color-text-muted)] hover:text-[var(--color-text-main)] hover:bg-stone-100 transition-colors"
          title="More"
        >
          <span class="material-icons-round text-lg">more_horiz</span>
        </button>
      </div>
    </div>
  </header>
}

<!-- Note Editor -->
<app-note-editor
  [note]="selectedNote()"
  [tag]="selectedTag()"
  (titleChange)="onTitleChange($event)"
  (contentChange)="onContentChange($event)"
/>

<!-- FAB for new note -->
<div class="absolute bottom-24 right-4 md:bottom-12 md:right-12 z-20">
  <button
    (click)="createNote()"
    class="bg-[var(--color-primary)] hover:bg-[var(--color-primary-hover)] text-white rounded-2xl w-14 h-14 flex items-center justify-center shadow-lg hover:shadow-xl hover:scale-105 transition-all duration-300 focus:outline-none focus:ring-4 focus:ring-[var(--color-primary)]/30 group"
  >
    <span
      class="material-icons-round text-2xl group-hover:rotate-90 transition-transform duration-300"
      >add</span
    >
  </button>
</div>
