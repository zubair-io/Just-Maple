@if (dialogService.activeDialog(); as dialog) {
  <div
    class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/50"
    (click)="onBackdropClick($event)"
    (keydown)="onKeyDown($event)"
  >
    <div
      class="dialog-panel mx-4 w-full max-w-sm rounded-xl bg-[var(--color-surface)] p-6 shadow-xl"
    >
      @if (dialog.title) {
        <h3 class="mb-2 text-lg font-semibold text-[var(--color-text-main)]">
          {{ dialog.title }}
        </h3>
      }

      <p class="mb-5 text-sm text-[var(--color-text-muted)]">
        {{ dialog.message }}
      </p>

      @if (dialog.type === 'prompt') {
        <input
          class="mb-5 w-full rounded-lg border border-[var(--color-border)] bg-[var(--color-input-bg)] px-3 py-2 text-sm text-[var(--color-text-main)] outline-none focus:border-[var(--color-primary)] focus:ring-1 focus:ring-[var(--color-primary)]"
          [placeholder]="dialog.placeholder ?? ''"
          [ngModel]="inputValue()"
          (ngModelChange)="inputValue.set($event)"
          #promptInput
        />
      }

      <div class="flex justify-end gap-2">
        @if (dialog.type !== 'alert') {
          <button
            class="rounded-lg px-4 py-2 text-sm font-medium text-[var(--color-text-muted)] transition-colors hover:bg-[var(--color-surface-hover)]"
            (click)="onCancel()"
          >
            {{ dialog.cancelLabel ?? 'Cancel' }}
          </button>
        }
        <button
          class="rounded-lg bg-[var(--color-primary)] px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-[var(--color-primary-hover)]"
          (click)="onConfirm()"
        >
          {{ dialog.confirmLabel ?? (dialog.type === 'alert' ? 'OK' : 'Confirm') }}
        </button>
      </div>
    </div>
  </div>
}
