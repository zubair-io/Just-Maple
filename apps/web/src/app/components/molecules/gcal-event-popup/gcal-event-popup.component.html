@if (isOpen()) {
  <div
    class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/50"
    (click)="onBackdropClick($event)"
    (keydown)="onKeydown($event)"
  >
    <div
      class="w-full max-w-sm mx-4 rounded-xl bg-[var(--color-surface,var(--color-bg))] shadow-xl border border-[var(--color-border)]"
      (click)="$event.stopPropagation()"
    >
      <!-- Header -->
      <div class="flex items-center gap-2 p-3 border-b border-[var(--color-border)]">
        <span class="w-2 h-2 rounded-full bg-[#4285f4] shrink-0"></span>
        <input
          #titleInput
          type="text"
          [ngModel]="title()"
          (ngModelChange)="title.set($event)"
          placeholder="Event title"
          class="flex-1 bg-transparent border-none outline-none font-semibold text-sm text-[var(--color-text-main)] placeholder:text-[var(--color-text-muted)]"
        />
        <button
          (click)="close()"
          class="text-[var(--color-text-muted)] hover:text-[var(--color-text-main)] text-lg leading-none px-1"
        >
          &times;
        </button>
      </div>

      <!-- Body -->
      <div class="p-3 flex flex-col gap-3">
        <!-- Time -->
        <div class="flex flex-col gap-1">
          <label class="text-xs font-semibold text-[var(--color-text-muted)]">Time</label>
          @if (isAllDay()) {
            <!-- All-day event: date inputs -->
            <div class="flex items-center gap-2 flex-wrap">
              <input
                type="date"
                [ngModel]="startDateValue()"
                (ngModelChange)="startDateValue.set($event)"
                class="flex-1 min-w-0 px-2 py-1 text-xs border rounded border-[var(--color-border)] bg-[var(--color-bg)] text-[var(--color-text-main)] outline-none focus:border-[#4285f4]"
              />
              <span class="text-xs text-[var(--color-text-muted)]">to</span>
              <input
                type="date"
                [ngModel]="endDateValue()"
                (ngModelChange)="endDateValue.set($event)"
                class="flex-1 min-w-0 px-2 py-1 text-xs border rounded border-[var(--color-border)] bg-[var(--color-bg)] text-[var(--color-text-main)] outline-none focus:border-[#4285f4]"
              />
            </div>
          } @else {
            <!-- Timed event: date label + time pickers -->
            @if (dateLabel()) {
              <span class="text-xs text-[var(--color-text-muted)]">{{ dateLabel() }}</span>
            }
            <div class="flex items-center gap-2 flex-wrap">
              <input
                type="time"
                [ngModel]="startTime()"
                (ngModelChange)="onStartTimeChange($event)"
                class="flex-1 min-w-0 px-2 py-1 text-xs border rounded border-[var(--color-border)] bg-[var(--color-bg)] text-[var(--color-text-main)] outline-none focus:border-[#4285f4]"
              />
              <span class="text-xs text-[var(--color-text-muted)]">to</span>
              <input
                type="time"
                [ngModel]="endTime()"
                (ngModelChange)="onEndTimeChange($event)"
                class="flex-1 min-w-0 px-2 py-1 text-xs border rounded outline-none focus:border-[#4285f4]"
                [class]="
                  endBeforeStart()
                    ? 'border-red-500 bg-[var(--color-bg)] text-[var(--color-text-main)]'
                    : 'border-[var(--color-border)] bg-[var(--color-bg)] text-[var(--color-text-main)]'
                "
              />
            </div>
            @if (endBeforeStart()) {
              <span class="text-xs text-red-500">End time must be after start</span>
            }
          }
        </div>

        <!-- Location -->
        <div class="flex flex-col gap-1">
          <label class="text-xs font-semibold text-[var(--color-text-muted)]">Location</label>
          <input
            type="text"
            [ngModel]="location()"
            (ngModelChange)="location.set($event)"
            placeholder="Add location"
            class="w-full px-2 py-1 text-xs border rounded border-[var(--color-border)] bg-[var(--color-bg)] text-[var(--color-text-main)] outline-none focus:border-[#4285f4] placeholder:text-[var(--color-text-muted)]"
          />
        </div>

        <!-- Description -->
        <div class="flex flex-col gap-1">
          <label class="text-xs font-semibold text-[var(--color-text-muted)]">Description</label>
          <textarea
            [ngModel]="description()"
            (ngModelChange)="description.set($event)"
            rows="3"
            placeholder="Add description"
            class="w-full px-2 py-1 text-xs border rounded border-[var(--color-border)] bg-[var(--color-bg)] text-[var(--color-text-main)] outline-none focus:border-[#4285f4] resize-y min-h-[48px] placeholder:text-[var(--color-text-muted)]"
          ></textarea>
        </div>
      </div>

      <!-- Footer -->
      <div
        class="flex items-center justify-between gap-2 p-3 border-t border-[var(--color-border)]"
      >
        @if (mode() === 'edit' && event()?.htmlLink) {
          <a
            [href]="event()!.htmlLink"
            target="_blank"
            rel="noopener noreferrer"
            class="text-xs text-[#4285f4] hover:underline"
            >Open in Google Calendar</a
          >
        }
        <button
          (click)="save()"
          [disabled]="saving() || endBeforeStart()"
          class="ml-auto px-3.5 py-1 rounded-md bg-[#4285f4] text-white text-xs font-medium hover:opacity-90 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          {{
            saving()
              ? mode() === 'create'
                ? 'Creating...'
                : 'Saving...'
              : mode() === 'create'
                ? 'Create'
                : 'Save'
          }}
        </button>
      </div>
    </div>
  </div>
}
