<div class="todo-popover" [style.top]="popoverStyle().top" [style.left]="popoverStyle().left">
  <!-- Header -->
  <div class="popover-header">
    <span class="popover-title">Todo Settings</span>
    <button type="button" class="close-btn" (click)="onClose()">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <path
          d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"
        />
      </svg>
    </button>
  </div>

  <!-- Due Date Section -->
  <div class="popover-section">
    <label class="section-label">Due Date</label>
    <div class="date-input-wrapper">
      <input
        #dateInput
        type="date"
        class="date-input"
        [value]="dateInputValue()"
        (change)="onDateInputChange($event)"
      />
      @if (currentDueDate()) {
        <button type="button" class="clear-btn" (click)="clearDueDate()">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
            <path
              d="M4.646 4.646a.5.5 0 0 1 .708 0L7 6.293l1.646-1.647a.5.5 0 0 1 .708.708L7.707 7l1.647 1.646a.5.5 0 0 1-.708.708L7 7.707 5.354 9.354a.5.5 0 0 1-.708-.708L6.293 7 4.646 5.354a.5.5 0 0 1 0-.708z"
            />
          </svg>
        </button>
      }
    </div>
    @if (formattedDueDate()) {
      <span class="date-preview">{{ formattedDueDate() }}</span>
    }
  </div>

  <!-- Priority Section -->
  <div class="popover-section">
    <label class="section-label">Priority</label>
    <div class="priority-buttons">
      @for (p of priorities; track p.value) {
        <button
          type="button"
          class="priority-btn"
          [class.active]="currentPriority() === p.value"
          [class.priority-high]="p.value === 'high'"
          [class.priority-medium]="p.value === 'medium'"
          [class.priority-low]="p.value === 'low'"
          (click)="setPriority(currentPriority() === p.value ? null : p.value)"
        >
          {{ p.label }}
        </button>
      }
    </div>
  </div>

  <!-- Color Section -->
  <div class="popover-section">
    <label class="section-label">Color</label>
    <div class="color-swatches">
      @for (c of colors; track c.value) {
        <button
          type="button"
          class="color-swatch"
          [style.background-color]="c.hex"
          [class.active]="currentColor() === c.value"
          [title]="c.label"
          (click)="setColor(currentColor() === c.value ? null : c.value)"
        >
          @if (currentColor() === c.value) {
            <svg width="12" height="12" viewBox="0 0 12 12" fill="white">
              <path d="M10 3L4.5 8.5L2 6" stroke="white" stroke-width="2" fill="none" />
            </svg>
          }
        </button>
      }
      @if (currentColor()) {
        <button type="button" class="clear-color-btn" (click)="clearColor()">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
            <path
              d="M4.646 4.646a.5.5 0 0 1 .708 0L7 6.293l1.646-1.647a.5.5 0 0 1 .708.708L7.707 7l1.647 1.646a.5.5 0 0 1-.708.708L7 7.707 5.354 9.354a.5.5 0 0 1-.708-.708L6.293 7 4.646 5.354a.5.5 0 0 1 0-.708z"
            />
          </svg>
        </button>
      }
    </div>
  </div>
</div>
