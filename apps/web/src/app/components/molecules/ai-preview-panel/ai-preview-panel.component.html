<div #panel class="ai-preview-panel">
  <div class="ai-preview-header">
    <span class="ai-preview-title">{{ getActionLabel() }}</span>
    <button class="ai-preview-close" (click)="onReject()" title="Close (Esc)">
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M18 6L6 18M6 6l12 12" />
      </svg>
    </button>
  </div>

  <div class="ai-preview-content">
    @if (error()) {
      <div class="ai-preview-error">
        <span class="error-icon">!</span>
        <span class="error-text">{{ error() }}</span>
      </div>
    } @else {
      <div class="ai-preview-text">
        @if (generatedText()) {
          {{ generatedText() }}
        }
        @if (isLoading()) {
          <span class="ai-cursor"></span>
        }
      </div>
      @if (!hasContent() && isLoading()) {
        <div class="ai-preview-loading">
          <span class="loading-dot"></span>
          <span class="loading-dot"></span>
          <span class="loading-dot"></span>
        </div>
      }
    }
  </div>

  <div class="ai-preview-footer">
    @if (error()) {
      <button class="ai-btn ai-btn-secondary" (click)="onRetry()">Retry</button>
      <button class="ai-btn ai-btn-secondary" (click)="onReject()">Close</button>
    } @else if (isLoading()) {
      <button class="ai-btn ai-btn-secondary" (click)="onCancel()">Cancel</button>
    } @else {
      <div class="ai-preview-actions">
        <button
          class="ai-btn ai-btn-primary"
          [disabled]="!canAccept()"
          (click)="onAccept()"
          title="Accept (Enter)"
        >
          Accept
        </button>
        <button class="ai-btn ai-btn-secondary" (click)="onReject()" title="Reject (Esc)">
          Reject
        </button>
        <button
          class="ai-btn ai-btn-icon"
          (click)="onCopy()"
          title="Copy to clipboard"
          [disabled]="!hasContent()"
        >
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="9" y="9" width="13" height="13" rx="2" />
            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" />
          </svg>
        </button>
      </div>
      <div class="ai-preview-hint">
        <span class="hint-key">Enter</span> to accept
        <span class="hint-separator">|</span>
        <span class="hint-key">Esc</span> to reject
      </div>
    }
  </div>
</div>
