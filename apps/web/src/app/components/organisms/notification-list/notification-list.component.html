<div class="notification-list">
  <app-notification-filters [filters]="filters()" (filtersChanged)="onFiltersChanged($event)" />

  @if (unreadCount() > 0) {
    <div class="flex justify-end px-4 py-2 border-b border-[var(--color-border)]">
      <button
        type="button"
        class="text-sm font-medium text-[var(--color-primary)] hover:text-[var(--color-primary-hover)] disabled:opacity-50"
        [disabled]="isMarkingAll()"
        (click)="onMarkAllAsRead()"
      >
        Mark all as read ({{ unreadCount() }})
      </button>
    </div>
  }

  @if (isLoading()) {
    <div class="notification-list__loading">
      <p>Loading notifications...</p>
    </div>
  } @else if (filteredNotifications().length === 0) {
    <div class="notification-list__empty">
      <p>No notifications</p>
    </div>
  } @else {
    <div class="notification-list__items">
      @for (notification of filteredNotifications(); track notification._id) {
        <app-notification-item
          [notification]="notification"
          (clicked)="onNotificationClicked($event)"
          (markAsRead)="onMarkAsRead($event)"
        />
      }
    </div>
  }
</div>
