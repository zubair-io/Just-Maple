<div class="whiteboard-container">
  @if (error(); as errorMsg) {
    <div class="error-state">
      <p>{{ errorMsg }}</p>
    </div>
  } @else if (!isReady()) {
    <div class="loading-state">
      <div class="loading-spinner"></div>
    </div>
  } @else if (whiteboard(); as wb) {
    <app-whiteboard-canvas
      [whiteboard]="wb"
      [pageId]="pageId()"
      [activeTool]="activeTool()"
      [strokeColor]="strokeColor()"
      [strokeSize]="strokeSize()"
      (cameraChange)="onCameraChange($event)"
      (cursorPositionChange)="onCursorPositionChange($event)"
      (sizeChange)="onCanvasSizeChange($event)"
    />

    <!-- Remote cursors overlay -->
    <app-whiteboard-cursors
      [awareness]="wb.awareness"
      [camera]="camera()"
      [canvasSize]="canvasSize()"
    />

    <div class="toolbar-container">
      <app-whiteboard-toolbar
        [activeTool]="activeToolType()"
        [strokeColor]="strokeColor()"
        [strokeSize]="strokeSize()"
        [zoom]="zoom()"
        (toolChange)="onToolChange($event)"
        (colorChange)="onColorChange($event)"
        (sizeChange)="onSizeChange($event)"
        (zoomIn)="onZoomIn()"
        (zoomOut)="onZoomOut()"
        (zoomReset)="onZoomReset()"
      />
    </div>
  }
</div>
