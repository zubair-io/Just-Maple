<div class="notebook-editor">
  @if (error()) {
    <div class="error-container">
      <span class="error-icon">!</span>
      <span class="error-text">{{ error() }}</span>
    </div>
  } @else {
    <!-- Editor wrapper for centering and max-width -->
    <div
      #editorWrapper
      class="editor-wrapper"
      [class.full-width]="isFullWidth()"
      (click)="onEditorWrapperClick($event)"
    >
      <div
        #editorElement
        class="editor-content"
        [class.loading]="!isReady()"
        [class.focused]="isFocused()"
      ></div>
    </div>

    <!-- Find & Replace bar (Cmd/Ctrl+F) -->
    @if (searchOpen()) {
      <div class="editor-search-bar">
        <div class="editor-search-row">
          <input
            class="editor-search-input"
            type="text"
            placeholder="Find"
            [value]="searchQuery()"
            (input)="onSearchQueryChange($any($event.target).value)"
            (keydown.enter)="searchFindNext()"
          />
          <span class="editor-search-count">
            {{ searchInfo().count ? searchInfo().active + '/' + searchInfo().count : 'No results' }}
          </span>
          <button
            type="button"
            class="editor-search-btn"
            title="Previous (Shift+Enter)"
            (click)="searchFindPrevious()"
          >
            ↑
          </button>
          <button
            type="button"
            class="editor-search-btn"
            title="Next (Enter)"
            (click)="searchFindNext()"
          >
            ↓
          </button>
          <button
            type="button"
            class="editor-search-btn"
            title="Close (Esc)"
            (click)="closeSearch()"
          >
            ✕
          </button>
        </div>
        <div class="editor-search-row">
          <input
            class="editor-search-input"
            type="text"
            placeholder="Replace"
            [value]="searchReplaceTerm()"
            (input)="onReplaceTermChange($any($event.target).value)"
          />
          <button type="button" class="editor-search-btn text" (click)="searchReplaceCurrent()">
            Replace
          </button>
          <button type="button" class="editor-search-btn text" (click)="searchReplaceAll()">
            All
          </button>
        </div>
      </div>
    }

    <!-- Floating Toolbar -->
    <app-editor-toolbar [editor]="getEditor()" />

    @if (!isReady()) {
      <div class="loading-overlay">
        <div class="loading-spinner"></div>
        <span>Loading notebook...</span>
      </div>
    }

    <!-- Page Link Search Modal -->
    <app-page-link-search
      [isOpen]="pageLinkSearchOpen()"
      [mode]="pageLinkSearchMode()"
      [notebookId]="notebookId()"
      [excludePageId]="pageId()"
      (closed)="closePageLinkSearch()"
      (selected)="onPageLinkSelected($event)"
      (createNew)="onPageLinkCreateNew($event)"
    />

    <!-- Google Calendar Event Popup -->
    <app-gcal-event-popup
      [isOpen]="gcalPopupOpen()"
      [mode]="gcalPopupMode()"
      [calendarId]="gcalPopupCalendarId()"
      [event]="gcalPopupEvent()"
      [defaultDate]="gcalPopupDefaultDate()"
      [timezone]="gcalPopupTimezone()"
      (closed)="gcalPopupOpen.set(false)"
      (saved)="onGcalEventSaved()"
    />
  }
</div>
