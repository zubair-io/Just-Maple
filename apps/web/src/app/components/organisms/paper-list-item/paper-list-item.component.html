<div
  class="flex p-2 bg-[var(--color-surface)] rounded-xl border-2 my-1 mx-2 cursor-pointer transition-colors overflow-hidden max-w-full"
  [class.border-[var(--color-primary)]]="selected()"
  [class.bg-[var(--color-primary-light)]]="selected()"
  [class.border-transparent]="!selected()"
  [class.hover:border-[var(--color-border)]]="!selected()"
>
  <div class="mr-4 flex-1 min-w-0 overflow-hidden">
    <h4 class="text-lg font-medium text-[var(--color-text-main)] truncate">
      {{ title() }}
    </h4>
    <div
      class="mt-1 text-sm text-[var(--color-text-muted)] truncate whitespace-nowrap overflow-hidden"
    >
      @for (tag of tags(); track $index; let last = $last) {
        <span>{{ tag.value }}</span>
        @if (!last) {
          <span> &bull; </span>
        }
      }
    </div>
    <div class="mt-2 flex items-center gap-2">
      <span class="px-2 py-0.5 text-xs font-medium rounded-full" [ngClass]="statusClass()">
        {{ statusLabel() }}
      </span>
      @if (collectable().data.quantity > 1) {
        <span class="text-xs text-[var(--color-text-muted)]">
          x{{ collectable().data.quantity }}
        </span>
      }
    </div>
  </div>
  @if (image()) {
    <div class="flex-shrink-0">
      <img
        [src]="image()"
        loading="lazy"
        class="h-20 w-20 rounded-lg object-cover"
        alt=""
        (error)="$any($event.target).style.display = 'none'"
      />
    </div>
  }
</div>
