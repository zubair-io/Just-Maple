<div class="editor-container" [class.readonly]="!editable()">
  <!-- Toolbar -->
  @if (editable()) {
    <div class="toolbar">
      <button
        type="button"
        (click)="toggleHeading(1)"
        [class.active]="isActive('heading', { level: 1 })"
        title="Heading 1"
      >
        <span class="material-symbols-rounded">format_h1</span>
      </button>
      <button
        type="button"
        (click)="toggleHeading(2)"
        [class.active]="isActive('heading', { level: 2 })"
        title="Heading 2"
      >
        <span class="material-symbols-rounded">format_h2</span>
      </button>
      <button
        type="button"
        (click)="toggleHeading(3)"
        [class.active]="isActive('heading', { level: 3 })"
        title="Heading 3"
      >
        <span class="material-symbols-rounded">format_h3</span>
      </button>
      <div class="divider"></div>
      <button type="button" (click)="toggleBold()" [class.active]="isActive('bold')" title="Bold">
        <span class="material-symbols-rounded">format_bold</span>
      </button>
      <button
        type="button"
        (click)="toggleItalic()"
        [class.active]="isActive('italic')"
        title="Italic"
      >
        <span class="material-symbols-rounded">format_italic</span>
      </button>
      <div class="divider"></div>
      <button
        type="button"
        (click)="toggleBulletList()"
        [class.active]="isActive('bulletList')"
        title="Bullet List"
      >
        <span class="material-symbols-rounded">format_list_bulleted</span>
      </button>
      <button
        type="button"
        (click)="toggleOrderedList()"
        [class.active]="isActive('orderedList')"
        title="Numbered List"
      >
        <span class="material-symbols-rounded">format_list_numbered</span>
      </button>
      <button
        type="button"
        (click)="toggleTaskList()"
        [class.active]="isActive('taskList')"
        title="Task List"
      >
        <span class="material-symbols-rounded">checklist</span>
      </button>
      <div class="divider"></div>
      <button
        type="button"
        (click)="toggleBlockquote()"
        [class.active]="isActive('blockquote')"
        title="Quote"
      >
        <span class="material-symbols-rounded">format_quote</span>
      </button>
      <button
        type="button"
        (click)="toggleCode()"
        [class.active]="isActive('code')"
        title="Inline Code"
      >
        <span class="material-symbols-rounded">code</span>
      </button>
      @if (tag()) {
        <div class="spacer"></div>
        <span class="toolbar-tag">
          <span class="material-symbols-rounded">tag</span>
          {{ tag()!.label }}
        </span>
      }
    </div>
  }

  <!-- TipTap Editor -->
  <div #editorElement class="editor-content"></div>
</div>
