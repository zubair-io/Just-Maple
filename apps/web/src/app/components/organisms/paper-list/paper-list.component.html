<cdk-virtual-scroll-viewport
  itemSize="116"
  minBufferPx="400"
  maxBufferPx="800"
  appendOnly
  class="paper-list-viewport"
>
  <app-paper-list-item
    *cdkVirtualFor="let collectable of collectables(); trackBy: trackByFn"
    [collectable]="collectable"
    [selected]="selectedCollectableId() === collectable._id"
    (click)="onSelectCollectable(collectable)"
  />
</cdk-virtual-scroll-viewport>
