<cdk-virtual-scroll-viewport
  itemSize="116"
  minBufferPx="400"
  maxBufferPx="800"
  appendOnly
  class="paper-list-viewport"
>
  <app-paper-list-item
    *cdkVirtualFor="let paper of papers(); trackBy: trackByFn"
    [paper]="paper"
    [selected]="selectedPaperId() === paper._id"
    (click)="onSelectPaper(paper)"
  />
</cdk-virtual-scroll-viewport>
