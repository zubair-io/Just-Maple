<div class="chat-container">
    <!-- Message List -->
    <div #messageList class="message-list" (scroll)="onScroll()">
        <!-- Load More Button -->
        @if (hasMore()) {
            <div class="load-more">
                @if (isLoading()) {
                    <span class="loading-text">Loading...</span>
                } @else {
                    <button type="button" (click)="loadMore()" class="load-more-btn">
                        Load earlier messages
                    </button>
                }
            </div>
        }

        <!-- Messages -->
        @for (message of messages(); track trackByMessage($index, message)) {
            <app-chat-message
                [message]="message"
                [isOwn]="isOwnMessage(message)"
            />
        } @empty {
            @if (!isLoading()) {
                <div class="no-messages">
                    <span class="material-icons-round">chat_bubble_outline</span>
                    <p>No messages yet. Start the conversation!</p>
                </div>
            }
        }

        <!-- Typing Indicator -->
        @if (typingUsers().length > 0) {
            <app-chat-typing [users]="typingUsers()" />
        }
    </div>

    <!-- Scroll to Bottom Button -->
    @if (showScrollButton()) {
        <button
            type="button"
            (click)="scrollToBottomClicked()"
            class="scroll-to-bottom"
            aria-label="Scroll to bottom"
        >
            <span class="material-icons-round">keyboard_arrow_down</span>
            @if (newMessageCount() > 0) {
                <span class="message-count">{{ newMessageCount() > 99 ? '99+' : newMessageCount() }}</span>
            }
        </button>
    }

    <!-- Message Input -->
    <div class="message-input">
        <div class="input-wrapper">
            <div #editorElement class="editor"></div>
        </div>
    </div>
</div>
