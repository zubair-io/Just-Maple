<div
  class="rounded-full bg-gradient-to-br from-orange-200 to-red-300 flex items-center justify-center font-bold text-orange-900 flex-shrink-0"
  [class]="sizeClasses()"
  [class.border]="showBorder()"
  [class.border-white]="showBorder()"
  [class.shadow-sm]="showBorder()"
>
  @if (profilePictureUrl() && profilePictureUrl()!.length > 5) {
    <!-- Real URL - render as image -->
    <img
      [src]="profilePictureUrl()"
      [alt]="displayName() || email()"
      class="w-full h-full rounded-full object-cover"
    />
  } @else if (profilePictureUrl()) {
    <!-- Emoji or short text - display as text -->
    {{ profilePictureUrl() }}
  } @else {
    <!-- No picture - show initials -->
    {{ initials() }}
  }
</div>
