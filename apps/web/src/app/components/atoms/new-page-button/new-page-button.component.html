<div class="relative" (click)="$event.stopPropagation()">
  <div class="flex">
    <!-- Main button -->
    <button
      (click)="createPage('memo')"
      class="flex items-center gap-1.5 px-2 md:px-3 py-1.5 bg-[var(--color-primary)] hover:bg-[var(--color-primary-hover)] text-white text-xs font-medium transition-colors"
      [class.rounded-lg]="isLocal()"
      [class.rounded-l-lg]="!isLocal()"
      title="New Note"
    >
      <span class="material-symbols-rounded text-sm">add</span>
      <span class="!hidden md:!inline">New Note</span>
    </button>
    <!-- Dropdown toggle (hidden for local notebooks) -->
    @if (!isLocal()) {
      <button
        (click)="toggleDropdown($event)"
        class="flex items-center px-1.5 py-1.5 bg-[var(--color-primary)] hover:bg-[var(--color-primary-hover)] text-white text-xs font-medium rounded-r-lg border-l border-white/20 transition-colors"
        title="More options"
      >
        <span class="material-symbols-rounded text-sm">
          {{ isDropdownOpen() ? 'expand_less' : 'expand_more' }}
        </span>
      </button>
    }
  </div>

  <!-- Dropdown menu (hidden for local notebooks) -->
  @if (!isLocal() && isDropdownOpen()) {
    <div
      class="absolute right-0 top-full mt-1 w-44 bg-[var(--color-surface)] rounded-lg shadow-lg border border-[var(--color-border)] py-1 z-50"
    >
      <button
        (click)="createPage('memo')"
        class="w-full flex items-center gap-2 px-3 py-2 text-xs text-[var(--color-text-main)] hover:bg-[var(--color-surface-hover)] transition-colors"
      >
        <span class="material-symbols-rounded text-base text-[var(--color-text-muted)]"
          >article</span
        >
        <span>New Note</span>
      </button>
      <button
        (click)="createPage('whiteboard')"
        class="w-full flex items-center gap-2 px-3 py-2 text-xs text-[var(--color-text-main)] hover:bg-[var(--color-surface-hover)] transition-colors"
      >
        <span class="material-symbols-rounded text-base text-[var(--color-text-muted)]">draw</span>
        <span>New Whiteboard</span>
      </button>
      @if (showConversation()) {
        <button
          (click)="createPage('message')"
          class="w-full flex items-center gap-2 px-3 py-2 text-xs text-[var(--color-text-main)] hover:bg-[var(--color-surface-hover)] transition-colors"
        >
          <span class="material-symbols-rounded text-base text-[var(--color-text-muted)]"
            >chat</span
          >
          <span>New Conversation</span>
        </button>
      }
      @if (showTemplate()) {
        <div class="my-1 border-t border-[var(--color-border)]"></div>
        <button
          (click)="onNewFromTemplate()"
          class="w-full flex items-center gap-2 px-3 py-2 text-xs text-[var(--color-text-main)] hover:bg-[var(--color-surface-hover)] transition-colors"
        >
          <span class="material-symbols-rounded text-base text-[var(--color-text-muted)]"
            >auto_awesome</span
          >
          <span>New from Template</span>
        </button>
      }
    </div>
  }
</div>
