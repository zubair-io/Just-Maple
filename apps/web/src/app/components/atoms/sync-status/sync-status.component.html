<div class="sync-status" [class]="status()">
  <span class="status-indicator material-symbols-rounded" [class.spinning]="status() === 'syncing'">
    {{ statusIcon() }}
  </span>
  <span
    class="status-text"
    [class.hidden]="status() === 'synced'"
    [class.md:inline]="status() === 'synced'"
    >{{ statusText() }}</span
  >

  @if (peersCount() > 0) {
    <span class="peers-count" title="Connected collaborators">
      <span class="peers-icon material-symbols-rounded">group</span>
      {{ peersCount() }}
    </span>
  }
</div>
