<div class="bot-output" [class.loading]="loading()">
  @if (loading()) {
    <div class="bot-output-loading">
      <span class="spinner"></span>
      <span>Processing...</span>
    </div>
  } @else if (error()) {
    <div class="bot-output-error">
      <span class="material-symbols-rounded error-icon">warning</span>
      <span>{{ error() }}</span>
    </div>
  } @else {
    <!-- TipTap read-only editor for ProseMirror JSON content -->
    <div #editorElement class="bot-output-content"></div>
  }
</div>
