<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Mercury Maple — Module Storyboard</title>

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />

        <!-- Material Symbols -->
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
        />

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Inter', sans-serif;
                background: linear-gradient(135deg, #141211 0%, #1a1918 50%, #141211 100%);
                background-attachment: fixed;
                color: #f5f5f4;
                min-height: 100vh;
                overflow: hidden;
            }

            /* Atmosphere glow */
            body::before {
                content: '';
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background:
                    radial-gradient(circle at 30% 50%, rgba(217, 78, 59, 0.05) 0%, transparent 50%),
                    radial-gradient(circle at 70% 80%, rgba(217, 78, 59, 0.03) 0%, transparent 50%);
                pointer-events: none;
                z-index: 0;
            }

            .container {
                display: flex;
                height: 100vh;
                position: relative;
                z-index: 1;
            }

            /* Space Rail (left edge) */
            .space-rail {
                width: 60px;
                background: rgba(38, 37, 36, 0.4);
                border-right: 1px solid rgba(255, 255, 255, 0.06);
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 12px 0;
                gap: 8px;
            }

            .space-icon {
                width: 40px;
                height: 40px;
                border-radius: 12px;
                background: rgba(255, 255, 255, 0.06);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: all 0.2s ease;
                color: #a8a29e;
            }

            .space-icon:hover {
                background: rgba(255, 255, 255, 0.1);
            }

            /* Module Dock */
            .dock {
                width: 52px;
                background: rgba(38, 37, 36, 0.65);
                backdrop-filter: blur(20px);
                border-right: 1px solid rgba(255, 255, 255, 0.08);
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 12px 0;
                gap: 6px;
                overflow-y: auto;
            }

            .dock-item {
                width: 40px;
                height: 40px;
                border-radius: 12px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: all 0.2s ease;
                position: relative;
                color: #a8a29e;
                font-size: 20px;
            }

            .dock-item:hover {
                background: rgba(255, 255, 255, 0.08);
            }

            .dock-item.active {
                background: rgba(217, 78, 59, 0.25);
                color: #d94e3b;
                box-shadow: 0 0 20px rgba(217, 78, 59, 0.3);
            }

            /* Main content area */
            .content-area {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 40px;
                position: relative;
            }

            /* Module screens container */
            .screens {
                position: relative;
                width: 100%;
                height: 100%;
            }

            .screen {
                position: absolute;
                width: 100%;
                height: 100%;
                opacity: 0;
                visibility: hidden;
                transition:
                    opacity 0.4s ease,
                    visibility 0.4s ease;
                display: flex;
                flex-direction: column;
            }

            .screen.active {
                opacity: 1;
                visibility: visible;
            }

            /* Focused module box */
            .module {
                background: rgba(38, 37, 36, 0.65);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(217, 78, 59, 0.15);
                border-radius: 16px;
                box-shadow:
                    0 0 40px rgba(255, 248, 230, 0.03),
                    0 0 80px rgba(217, 78, 59, 0.04),
                    inset 0 0 40px rgba(217, 78, 59, 0.03);
                padding: 32px;
                width: 100%;
                height: 100%;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            .module-header {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-bottom: 24px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
                padding-bottom: 16px;
            }

            .module-icon {
                font-size: 32px;
                color: #d94e3b;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .module-title {
                font-size: 20px;
                font-weight: 600;
                color: #f5f5f4;
            }

            .module-content {
                flex: 1;
                overflow-y: auto;
                overflow-x: hidden;
            }

            /* Right Network Panel */
            .network-panel {
                width: 220px;
                background: rgba(38, 37, 36, 0.65);
                backdrop-filter: blur(20px);
                border-left: 1px solid rgba(255, 255, 255, 0.08);
                border-top-left-radius: 16px;
                border-bottom-left-radius: 16px;
                padding: 20px;
                display: flex;
                flex-direction: column;
                gap: 20px;
                margin-right: 0;
            }

            .network-graph {
                width: 100%;
                height: 120px;
                background: rgba(255, 255, 255, 0.02);
                border-radius: 12px;
                border: 1px solid rgba(255, 255, 255, 0.06);
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 12px;
            }

            .network-links {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .network-link {
                font-size: 12px;
                color: #a8a29e;
                padding: 8px;
                background: rgba(255, 255, 255, 0.04);
                border-radius: 8px;
                border: 1px solid rgba(255, 255, 255, 0.06);
                cursor: pointer;
                transition: all 0.2s ease;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .network-link:hover {
                background: rgba(255, 255, 255, 0.08);
                color: #f5f5f4;
            }

            /* Bottom Navigation */
            .bottom-nav {
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                align-items: center;
                gap: 16px;
                background: rgba(38, 37, 36, 0.8);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 12px;
                padding: 12px 20px;
                z-index: 100;
            }

            .slide-counter {
                font-size: 12px;
                color: #a8a29e;
                font-weight: 500;
            }

            .nav-dots {
                display: flex;
                gap: 6px;
            }

            .dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.2);
                cursor: pointer;
                transition: all 0.2s ease;
            }

            .dot.active {
                background: #d94e3b;
                box-shadow: 0 0 12px rgba(217, 78, 59, 0.5);
            }

            .keyboard-hints {
                font-size: 11px;
                color: #78716c;
                display: flex;
                gap: 8px;
            }

            .hint {
                padding: 4px 8px;
                background: rgba(255, 255, 255, 0.04);
                border-radius: 4px;
            }

            /* Content styles */
            h1 {
                font-size: 28px;
                font-weight: 700;
                color: #f5f5f4;
                margin-bottom: 16px;
            }

            h2 {
                font-size: 18px;
                font-weight: 600;
                color: #f5f5f4;
                margin: 20px 0 12px 0;
            }

            h3 {
                font-size: 14px;
                font-weight: 600;
                color: #f5f5f4;
                margin: 16px 0 8px 0;
            }

            p {
                font-family: 'Merriweather', serif;
                font-size: 14px;
                color: #a8a29e;
                line-height: 1.6;
                margin-bottom: 12px;
            }

            .wikilink {
                color: #d94e3b;
                text-decoration: none;
                cursor: pointer;
                transition: all 0.2s ease;
            }

            .wikilink:hover {
                text-decoration: underline;
            }

            code {
                font-family: 'JetBrains Mono', monospace;
                font-size: 12px;
                background: rgba(255, 255, 255, 0.04);
                padding: 2px 6px;
                border-radius: 4px;
                color: #e8d5b7;
            }

            blockquote {
                border-left: 3px solid rgba(217, 78, 59, 0.3);
                padding-left: 16px;
                margin: 16px 0;
                font-style: italic;
                color: #a8a29e;
            }

            /* Cards and lists */
            .card {
                background: rgba(255, 255, 255, 0.04);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 12px;
                padding: 16px;
                margin-bottom: 12px;
                transition: all 0.2s ease;
            }

            .card:hover {
                background: rgba(255, 255, 255, 0.06);
                border-color: rgba(255, 255, 255, 0.12);
            }

            .card-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 8px;
            }

            .card-title {
                font-weight: 600;
                color: #f5f5f4;
            }

            .badge {
                font-size: 11px;
                padding: 4px 10px;
                border-radius: 6px;
                background: rgba(217, 78, 59, 0.2);
                color: #d94e3b;
                font-weight: 500;
            }

            /* Priority dots */
            .priority {
                display: inline-block;
                width: 8px;
                height: 8px;
                border-radius: 50%;
                margin-right: 6px;
                vertical-align: middle;
            }

            .priority.high {
                background: #dc2626;
            }
            .priority.medium {
                background: #f59e0b;
            }
            .priority.low {
                background: #3b82f6;
            }

            /* Avatars */
            .avatar {
                width: 32px;
                height: 32px;
                border-radius: 8px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: 600;
                color: white;
                font-size: 12px;
            }

            .avatar.red {
                background: rgba(217, 78, 59, 0.4);
            }
            .avatar.blue {
                background: rgba(96, 165, 250, 0.4);
            }
            .avatar.green {
                background: rgba(74, 222, 128, 0.4);
            }
            .avatar.purple {
                background: rgba(192, 132, 252, 0.4);
            }
            .avatar.amber {
                background: rgba(251, 191, 36, 0.4);
            }

            /* Grid layouts */
            .grid-2 {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
                margin-bottom: 16px;
            }

            .grid-3 {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                gap: 12px;
                margin-bottom: 16px;
            }

            .grid-4 {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 12px;
            }

            /* Kanban columns */
            .kanban-board {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 16px;
                height: 100%;
            }

            .kanban-column {
                background: rgba(255, 255, 255, 0.02);
                border: 1px solid rgba(255, 255, 255, 0.06);
                border-radius: 12px;
                padding: 16px;
                display: flex;
                flex-direction: column;
            }

            .kanban-header {
                font-weight: 600;
                font-size: 13px;
                color: #f5f5f4;
                margin-bottom: 12px;
                padding-bottom: 8px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            }

            .kanban-card {
                background: rgba(38, 37, 36, 0.65);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 8px;
                padding: 12px;
                margin-bottom: 10px;
                border-left: 3px solid #d94e3b;
                cursor: grab;
                transition: all 0.2s ease;
            }

            .kanban-card:hover {
                background: rgba(38, 37, 36, 0.85);
            }

            .kanban-card.medium {
                border-left-color: #f59e0b;
            }

            .kanban-card.low {
                border-left-color: #3b82f6;
            }

            .kanban-card-title {
                font-size: 13px;
                font-weight: 500;
                color: #f5f5f4;
                margin-bottom: 6px;
            }

            .kanban-card-meta {
                display: flex;
                align-items: center;
                justify-content: space-between;
                font-size: 11px;
                color: #a8a29e;
            }

            /* Editor toolbar */
            .editor-toolbar {
                display: flex;
                gap: 4px;
                margin-bottom: 16px;
                padding: 8px;
                background: rgba(255, 255, 255, 0.04);
                border-radius: 8px;
                border: 1px solid rgba(255, 255, 255, 0.08);
            }

            .toolbar-btn {
                padding: 6px 10px;
                background: rgba(255, 255, 255, 0.06);
                border: none;
                border-radius: 6px;
                color: #a8a29e;
                cursor: pointer;
                font-size: 12px;
                transition: all 0.2s ease;
            }

            .toolbar-btn:hover {
                background: rgba(255, 255, 255, 0.12);
                color: #f5f5f4;
            }

            /* Canvas placeholder */
            .canvas-placeholder {
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.3);
                border-radius: 8px;
                border: 1px solid rgba(255, 255, 255, 0.06);
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
            }

            /* Message styles */
            .message-group {
                display: flex;
                gap: 12px;
                margin-bottom: 16px;
                animation: slideIn 0.3s ease;
            }

            @keyframes slideIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .message-bubble {
                background: rgba(96, 165, 250, 0.1);
                border: 1px solid rgba(96, 165, 250, 0.2);
                border-radius: 12px;
                padding: 12px;
                max-width: 70%;
            }

            .message-bubble.bot {
                background: rgba(192, 132, 252, 0.1);
                border-color: rgba(192, 132, 252, 0.2);
            }

            .message-name {
                font-size: 12px;
                font-weight: 600;
                color: #f5f5f4;
                margin-bottom: 4px;
            }

            .message-text {
                font-family: 'Merriweather', serif;
                font-size: 13px;
                color: #a8a29e;
                line-height: 1.5;
            }

            .message-time {
                font-size: 11px;
                color: #78716c;
                margin-top: 4px;
            }

            .typing-indicator {
                display: flex;
                gap: 4px;
                padding: 12px;
            }

            .typing-dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.3);
                animation: pulse 1.4s infinite;
            }

            .typing-dot:nth-child(2) {
                animation-delay: 0.2s;
            }
            .typing-dot:nth-child(3) {
                animation-delay: 0.4s;
            }

            @keyframes pulse {
                0%,
                100% {
                    opacity: 0.4;
                }
                50% {
                    opacity: 1;
                }
            }

            /* Input area */
            .input-area {
                margin-top: 16px;
                display: flex;
                gap: 8px;
            }

            .input-field {
                flex: 1;
                background: rgba(255, 255, 255, 0.04);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 8px;
                padding: 10px 12px;
                color: #f5f5f4;
                font-family: 'Inter', sans-serif;
                font-size: 13px;
            }

            .input-field::placeholder {
                color: rgba(168, 162, 158, 0.4);
            }

            .send-btn {
                padding: 10px 16px;
                background: rgba(217, 78, 59, 0.2);
                border: 1px solid rgba(217, 78, 59, 0.3);
                border-radius: 8px;
                color: #d94e3b;
                cursor: pointer;
                font-weight: 500;
                transition: all 0.2s ease;
            }

            .send-btn:hover {
                background: rgba(217, 78, 59, 0.3);
                box-shadow: 0 0 12px rgba(217, 78, 59, 0.3);
            }

            /* JSON editor */
            .json-editor {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
                height: 100%;
            }

            .json-raw {
                background: rgba(0, 0, 0, 0.3);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 8px;
                padding: 16px;
                font-family: 'JetBrains Mono', monospace;
                font-size: 12px;
                overflow-y: auto;
                color: #a8a29e;
            }

            .json-key {
                color: #60a5fa;
            }
            .json-string {
                color: #4ade80;
            }
            .json-number {
                color: #fbbf24;
            }
            .json-boolean {
                color: #f472b6;
            }

            .json-form {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .form-group {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .form-label {
                font-size: 12px;
                font-weight: 600;
                color: #a8a29e;
            }

            .form-input {
                background: rgba(255, 255, 255, 0.04);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 6px;
                padding: 8px;
                color: #f5f5f4;
                font-family: 'JetBrains Mono', monospace;
                font-size: 12px;
            }

            /* Todo list */
            .todo-list {
                display: flex;
                flex-direction: column;
                gap: 16px;
            }

            .todo-section {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .todo-section-title {
                font-size: 12px;
                font-weight: 700;
                color: #78716c;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }

            .todo-item {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 12px;
                background: rgba(255, 255, 255, 0.02);
                border: 1px solid rgba(255, 255, 255, 0.06);
                border-radius: 8px;
                transition: all 0.2s ease;
            }

            .todo-item:hover {
                background: rgba(255, 255, 255, 0.04);
            }

            .todo-item.done {
                opacity: 0.5;
            }

            .todo-item.done .todo-text {
                text-decoration: line-through;
            }

            .todo-checkbox {
                width: 16px;
                height: 16px;
                border-radius: 4px;
                border: 1px solid rgba(255, 255, 255, 0.2);
                cursor: pointer;
                background: transparent;
                transition: all 0.2s ease;
            }

            .todo-item.done .todo-checkbox {
                background: rgba(74, 222, 128, 0.4);
                border-color: rgba(74, 222, 128, 0.6);
            }

            .todo-text {
                flex: 1;
                font-size: 13px;
                color: #a8a29e;
            }

            .todo-date {
                font-size: 11px;
                color: #78716c;
            }

            /* Progress bar */
            .progress-bar {
                width: 100%;
                height: 6px;
                background: rgba(255, 255, 255, 0.06);
                border-radius: 3px;
                overflow: hidden;
                margin: 8px 0;
            }

            .progress-fill {
                height: 100%;
                background: linear-gradient(90deg, #d94e3b, #f59e0b);
                transition: width 0.3s ease;
            }

            /* Timeline / waveform */
            .timeline {
                display: flex;
                align-items: center;
                gap: 12px;
                margin: 16px 0;
            }

            .timeline-bars {
                flex: 1;
                display: flex;
                align-items: flex-end;
                gap: 2px;
                height: 60px;
            }

            .bar {
                flex: 1;
                background: rgba(217, 78, 59, 0.3);
                border-radius: 2px;
                transition: all 0.1s ease;
            }

            .bar.active {
                background: #d94e3b;
            }

            .timeline-time {
                font-family: 'JetBrains Mono', monospace;
                font-size: 12px;
                color: #a8a29e;
                min-width: 45px;
            }

            /* Event / Calendar */
            .calendar-grid {
                display: grid;
                grid-template-columns: repeat(7, 1fr);
                gap: 2px;
                margin-bottom: 16px;
                background: rgba(255, 255, 255, 0.04);
                padding: 8px;
                border-radius: 8px;
            }

            .calendar-day {
                padding: 8px;
                text-align: center;
                font-size: 11px;
                color: #a8a29e;
                border: 1px solid rgba(255, 255, 255, 0.06);
                border-radius: 4px;
            }

            .calendar-day.header {
                font-weight: 600;
                color: #78716c;
                background: rgba(255, 255, 255, 0.02);
            }

            .event-block {
                background: rgba(96, 165, 250, 0.2);
                border-left: 3px solid #60a5fa;
                padding: 8px;
                border-radius: 4px;
                margin-bottom: 8px;
                font-size: 11px;
                color: #a8a29e;
            }

            .event-block.red {
                background: rgba(217, 78, 59, 0.2);
                border-left-color: #d94e3b;
            }

            .event-block.green {
                background: rgba(74, 222, 128, 0.2);
                border-left-color: #4ade80;
            }

            .event-block.purple {
                background: rgba(192, 132, 252, 0.2);
                border-left-color: #c084fc;
            }

            .event-title {
                font-weight: 600;
                color: #f5f5f4;
            }

            .event-time {
                font-size: 10px;
                color: #78716c;
                margin-top: 2px;
            }

            /* Stats */
            .stat-box {
                background: rgba(255, 255, 255, 0.04);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 12px;
                padding: 16px;
                text-align: center;
            }

            .stat-value {
                font-size: 24px;
                font-weight: 700;
                color: #d94e3b;
                margin-bottom: 4px;
            }

            .stat-label {
                font-size: 12px;
                color: #a8a29e;
            }

            /* Ring chart */
            .ring-chart {
                width: 100px;
                height: 100px;
                margin: 0 auto;
            }

            /* Template card */
            .template-card {
                background: rgba(255, 255, 255, 0.04);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 12px;

            // Initialize UI
            function init() {
                const screensContainer = document.getElementById('screens');
                const dock = document.getElementById('dock');
                const navDots = document.getElementById('nav-dots');

                // Create screens
                modules.forEach((module, index) => {
                    const screen = document.createElement('div');
                    screen.className = `screen ${index === 0 ? 'active' : ''}`;
                    screen.innerHTML = `
                                <div class="module">
                                    <div class="module-header">
                                        <div class="module-icon" style="background: rgba(217, 78, 59, 0.1); width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                                            <span class="material-symbols-rounded" style="color: ${module.color};">${module.icon}</span>
                                        </div>
                                        <div class="module-title">${module.name}</div>
                                    </div>
                                    ${module.content}
                                </div>
                            `;
                    screensContainer.appendChild(screen);
                });

                // Create dock items
                modules.forEach((module, index) => {
                    const dockItem = document.createElement('div');
                    dockItem.className = `dock-item ${index === 0 ? 'active' : ''}`;
                    dockItem.innerHTML = `<span class="material-symbols-rounded">${module.icon}</span>`;
                    dockItem.addEventListener('click', () => goToScreen(index));
                    dock.appendChild(dockItem);
                });

                // Create navigation dots
                modules.forEach((module, index) => {
                    const dot = document.createElement('div');
                    dot.className = `dot ${index === 0 ? 'active' : ''}`;
                    dot.addEventListener('click', () => goToScreen(index));
                    navDots.appendChild(dot);
                });

                // Initialize total slides
                document.getElementById('total-slides').textContent = modules.length;

                // Keyboard navigation
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowRight') goToNextScreen();
                    if (e.key === 'ArrowLeft') goToPrevScreen();
                });
            }

            let currentIndex = 0;

            function goToScreen(index) {
                const screens = document.querySelectorAll('.screen');
                const dockItems = document.querySelectorAll('.dock-item');
                const dots = document.querySelectorAll('.dot');

                screens.forEach((s) => s.classList.remove('active'));
                dockItems.forEach((d) => d.classList.remove('active'));
                dots.forEach((d) => d.classList.remove('active'));

                screens[index].classList.add('active');
                dockItems[index].classList.add('active');
                dots[index].classList.add('active');

                document.getElementById('current-slide').textContent = index + 1;
                currentIndex = index;

                updateNetworkPanel(index);
            }

            function goToNextScreen() {
                if (currentIndex < modules.length - 1) {
                    goToScreen(currentIndex + 1);
                }
            }

            function goToPrevScreen() {
                if (currentIndex > 0) {
                    goToScreen(currentIndex - 1);
                }
            }

            function updateNetworkPanel(index) {
                const module = modules[index];
                const networkGraph = document.getElementById('network-graph');
                const networkLinks = document.getElementById('network-links');

                // Clear and update links
                networkLinks.innerHTML = module.links
                    .map((link) => `<div class="network-link">${link}</div>`)
                    .join('');

                // Simple SVG graph visualization
                networkGraph.innerHTML = `
                            <svg width="100%" height="100%" viewBox="0 0 180 120">
                                <circle cx="40" cy="30" r="15" fill="rgba(217, 78, 59, 0.3)" stroke="rgba(217, 78, 59, 0.6)" stroke-width="1.5"/>
                                <circle cx="140" cy="40" r="12" fill="rgba(96, 165, 250, 0.3)" stroke="rgba(96, 165, 250, 0.5)" stroke-width="1.5"/>
                                <circle cx="90" cy="90" r="14" fill="rgba(251, 191, 36, 0.3)" stroke="rgba(251, 191, 36, 0.5)" stroke-width="1.5"/>
                                <line x1="40" y1="30" x2="90" y2="90" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
                                <line x1="140" y1="40" x2="90" y2="90" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
                            </svg>
                        `;
            }

            // Initialize on load
            init();
        </script>
