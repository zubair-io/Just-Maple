version: '3.8'

# Just Maple - Simplified deployment for existing MongoDB/Redis infrastructure
# Uses Azure Container Registry (ACR) for the API image
#
# Usage:
#   1. Login to ACR: docker login acrjustmaple.azurecr.io
#   2. Configure .env file
#   3. docker compose -f docker-compose.acr.yml up -d

services:
    api:
        image: acrjustmaple.azurecr.io/justmaple-api:latest
        container_name: justmaple-api
        restart: unless-stopped
        ports:
            - '7071:7071'
        environment:
            # Point to your existing MongoDB and Redis
            - MONGODB_URI=${MONGODB_URI}
            - REDIS_URL=${REDIS_URL}
            - JWT_SECRET=${JWT_SECRET}
            # WebAuthn config
            - RP_NAME=${RP_NAME:-Just Maple}
            - RP_ID=${RP_ID}
            - ORIGIN=${ORIGIN}
            # Optional services
            - GRAVATAR_KEY=${GRAVATAR_KEY:-}
            - HORNBEAM=${HORNBEAM:-}
            - AZURE_COMMUNICATION_CONNECTION_STRING=${AZURE_COMMUNICATION_CONNECTION_STRING:-}
            - EMAIL_FROM=${EMAIL_FROM:-}
            - PAPERBARK_URL=${PAPERBARK_URL:-}
            - PAPERBARK_API_KEY=${PAPERBARK_API_KEY:-}
        healthcheck:
            test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:7071/api/health']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        labels:
            - 'com.centurylinklabs.watchtower.enable=true'
        networks:
            - justmaple

    # Watchtower for auto-updates with ACR authentication
    watchtower:
        image: containrrr/watchtower:latest
        container_name: justmaple-watchtower
        restart: unless-stopped
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            # Mount Docker config for ACR credentials
            - ~/.docker/config.json:/config.json:ro
        environment:
            - WATCHTOWER_CLEANUP=true
            - WATCHTOWER_POLL_INTERVAL=86400
            - WATCHTOWER_LABEL_ENABLE=true
            - DOCKER_CONFIG=/
        command: --interval 86400 --cleanup --label-enable
        networks:
            - justmaple

networks:
    justmaple:
        driver: bridge
