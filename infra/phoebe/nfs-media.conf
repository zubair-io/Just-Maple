# Install as /etc/systemd/system/just-maple-api.service.d/nfs-media.conf in CT131.
# Host /mnt/just-maple must be mounted and bound into CT131 at the same path.
[Service]
ReadWritePaths=/mnt/just-maple/media
ExecStartPre=/usr/bin/mountpoint -q /mnt/just-maple
ExecStartPre=/usr/bin/test -r /mnt/just-maple/media/.just-maple-instance
