# Direct LAN HTTPS on CT131. Public traffic enters through cloudflared on loopback.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name local.phoebe.justmaple.app;
    ssl_certificate /etc/letsencrypt/live/local.phoebe.justmaple.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/local.phoebe.justmaple.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    allow 192.168.0.0/23;
    allow 127.0.0.1;
    allow ::1;
    deny all;
    client_max_body_size 100m;
    location / {
        proxy_pass http://127.0.0.1:7071;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
